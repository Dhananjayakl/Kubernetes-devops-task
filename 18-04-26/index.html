<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My K8s Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }
    h1 { font-size: 3rem; }
    p  { font-size: 1.2rem; opacity: 0.85; }
    .badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 18px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div>
    <h1>🚀 Hello from Kubernetes!</h1>
    <p>Deployed on AWS EKS with Docker</p>
    <span class="badge">Pod is healthy ✅</span>
  </div>
</body>
</html>
