# secret-env-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
spec:
  tolerations:
  - key: "key"
    operator: "Equal"
    value: "value"
    effect: "NoSchedule"
  containers:
  - name: app
    image: nginx:latest
    # Method A: Inject ALL secret keys at once
    envFrom:
    - secretRef:
        name: app-secret
    # Method B: Inject specific key with custom name
    env:
    - name: DATABASE_PASSWORD       # custom env var name
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD