# secret-volume-pod.yaml
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
spec:
  tolerations:
  - key: "key"
    operator: "Equal"
    value: "value"
    effect: "NoSchedule"
  containers:
  - name: app
    image: nginx:latest
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets      # each key becomes a file here
      readOnly: true
    # Mount only a SPECIFIC key as a specific filename
    - name: secret-single
      mountPath: /etc/db-password  # single file mount
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: app-secret       # ALL keys mounted as individual files
      defaultMode: 0400            # read-only by owner (security best practice)
  - name: secret-single
    secret:
      secretName: app-secret
      items:
      - key: DB_PASSWORD
        path: password.txt         # mounts ONLY this key as password.txt